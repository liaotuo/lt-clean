name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go build
        run: go build ./...

  artifacts:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build archive
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          bin_dir="dist/lt-clean_${{ matrix.goos }}_${{ matrix.goarch }}"
          archive="${bin_dir}.tar.gz"
          go build -trimpath -ldflags="-s -w" -o "${bin_dir}/lt-clean" .
          tar -C dist -czf "${archive}" "lt-clean_${{ matrix.goos }}_${{ matrix.goarch }}"

      - name: upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: lt-clean_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/lt-clean_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
